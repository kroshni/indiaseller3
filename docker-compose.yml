version: '3.8'

services:
  cassandra:
    image: cassandra:latest
    container_name: indiaseller_cassandra
    ports:
      - "9043:9042"  # Changed host port to 9043
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./backups:/backups  # Mount a directory for backups
    environment:
      - CASSANDRA_CLUSTER_NAME=IndiaSeller
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  cassandra_data:
    name: indiaseller_cassandra_data 